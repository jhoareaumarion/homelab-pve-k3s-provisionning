- name: Add Cilium repository in Helm
  kubernetes.core.helm_repository:
    name: cilium
    repo_url: https://helm.cilium.io/
    state: present
    
- name: Enable Egress Gateway and Hubble
  kubernetes.core.helm:
    release_name: cilium
    chart_ref: cilium/cilium
    chart_version: "1.18.6"
    release_namespace: kube-system
    release_state: present
    kubeconfig: /home/{{ control_node_username }}/.kube/config
    release_values:
      mtu: 1400
      enablePMTU: true
      operator:
        replicas: 1
      hubble:
        relay:
          enabled: true
        ui:
          enabled: true
      egressGateway:
        enabled: true
      ingressController:
        enabled: true
        default: true
      bpf:
        masquerade: true
      kubeProxyReplacement: true
      gatewayAPI:
        enabled: true
        replicas: 1
      l2announcements:
        enabled: true
      externalIPs:
        enabled: true

- name: Download Hubble client tarball
  ansible.builtin.get_url:
    url: "https://github.com/cilium/hubble/releases/download/{{ hubble_version }}/hubble-linux-{{ cli_arch }}.tar.gz"
    dest: "/tmp/hubble-linux-{{ cli_arch }}.tar.gz"
    mode: '0644'

- name: Install Hubble binary
  ansible.builtin.unarchive:
    src: "/tmp/hubble-linux-{{ cli_arch }}.tar.gz"
    dest: /usr/local/bin
    remote_src: true
    creates: /usr/local/bin/hubble
    mode: '0755'
  become: true

- name: Cleanup Hubble temp file
  ansible.builtin.file:
    path: /tmp/hubble-linux-{{ cli_arch }}.tar.gz
    state: absent
