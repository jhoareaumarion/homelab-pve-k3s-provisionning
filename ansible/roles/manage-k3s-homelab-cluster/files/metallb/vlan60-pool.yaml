apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: vlan60-pool
  namespace: metallb-system
spec:
  addresses:
  - 10.10.60.150-10.10.60.199
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: vlan60-advertisement
  namespace: metallb-system
spec:
  ipAddressPools:
  - vlan60-pool
  interfaces:
  - ens18.60
  nodeSelectors:
  - matchLabels:
      egress: "60"
