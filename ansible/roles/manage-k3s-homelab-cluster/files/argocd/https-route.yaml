apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd-route
  namespace: argocd
spec:
  parentRefs:
  - name: argocd-gateway
    sectionName: https 
  hostnames:
  - argocd.hoareau-marion.eu
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: argocd-server
      port: 80  
  - matches:
    - path:
        type: PathPrefix
        value: /api
    backendRefs:
    - name: argocd-server
      port: 80
